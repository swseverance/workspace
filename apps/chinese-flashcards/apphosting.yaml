# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  maxInstances: 1 # caps cost; environments may raise it
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

env:
  # Trust App Hosting's proxy for the visitor's host. Its build preparer used
  # to inject this; see NG_ALLOWED_HOSTS in the environment yamls for why it
  # no longer does.
  - variable: NG_TRUST_PROXY_HEADERS
    value: X-Forwarded-Host
    availability:
      - RUNTIME

# Environment variables and secrets.
# env:
# Configure environment variables.
# See https://firebase.google.com/docs/app-hosting/configure#user-defined-environment
