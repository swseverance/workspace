# apps/tcpl-exercises/angular.json is an empty placeholder: App Hosting's build preparer
# only injects NG_ALLOWED_HOSTS and NG_TRUST_PROXY_HEADERS (which Angular SSR
# needs, or it rejects every request with 400) when the backend's rootDir has
# an angular.json, and Nx keeps the real config elsewhere. Don't delete it.
# See https://github.com/GoogleCloudPlatform/buildpacks/commit/fb7a183f6203df0635c490b5c617028bcb6339b6

runConfig:
  minInstances: 0
  maxInstances: 1 # caps cost; environments may raise it
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

env:
  - variable: VERCEL_TEAM_ID
    value: team_0M3MOKT5ntF9hBTAuhcJCd0g
    availability:
      - RUNTIME
  - variable: UPSTASH_REDIS_REST_URL
    value: https://loyal-minnow-40926.upstash.io
    availability:
      - RUNTIME
