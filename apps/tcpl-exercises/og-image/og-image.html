<!--
  Source for public/og-image.png, the link preview image (1200x630).
  Regenerate it with headless Chrome, from the workspace root:

  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
    --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 \
    --screenshot=apps/tcpl-exercises/public/og-image.png \
    "file://$PWD/apps/tcpl-exercises/og-image/og-image.html"
-->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        background: linear-gradient(135deg, #1857a4 0%, #0f3a70 100%);
        color: #fff;
        font-family: -apple-system, 'Helvetica Neue', Helvetica, sans-serif;
        display: flex;
        align-items: center;
        gap: 64px;
        padding: 0 88px;
      }
      .logo {
        flex: 0 0 260px;
        height: 260px;
        background: #fff;
        border-radius: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #1857a4;
        font:
          900 210px/1 'Arial Black',
          'Helvetica Neue',
          Helvetica,
          sans-serif;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
      }
      .text {
        display: flex;
        flex-direction: column;
        gap: 28px;
      }
      h1 {
        font-size: 64px;
        font-weight: 800;
        line-height: 1.08;
        letter-spacing: -1px;
      }
      p {
        font-size: 34px;
        line-height: 1.3;
        color: rgba(255, 255, 255, 0.85);
      }
      code {
        align-self: flex-start;
        font:
          500 26px/1 Menlo,
          monospace;
        background: rgba(0, 0, 0, 0.28);
        padding: 14px 20px;
        border-radius: 10px;
        color: #cfe3ff;
      }
    </style>
  </head>
  <body>
    <div class="logo">C</div>
    <div class="text">
      <h1>The C Programming Language Exercises</h1>
      <p>
        Solve the K&amp;R exercises in your browser, with tests and reference
        solutions.
      </p>
      <code>printf("hello, world\n");</code>
    </div>
  </body>
</html>
