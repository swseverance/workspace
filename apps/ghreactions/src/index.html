<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GitHub Reactions</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Per-page title, description and canonical URL come from SeoService. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GitHub Reactions" />
    <!-- og:image itself needs an absolute URL, so SeoService adds it. -->
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <!-- X reads og:title, og:description and og:image too. -->
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Real files, not a data: URI: Google only shows an icon it can fetch,
         and otherwise falls back to /favicon.ico. The thumbs-up is from
         Twemoji (jdecked/twemoji), licensed CC-BY 4.0. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "GitHub Reactions",
        "description": "Search GitHub for reactions to issues, PRs, and commits. View activity across any public GitHub account.",
        "url": "https://ghreactions.io",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "All"
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
