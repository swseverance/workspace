env:
  - variable: PROJECT_ID
    value: ghreactionsdev
    availability:
      - RUNTIME
  - variable: SITE_URL
    value: https://ghreactions--ghreactionsdev.us-east4.hosted.app
    availability:
      - RUNTIME
  - variable: ENVIRONMENT_NAME
    value: dev
    availability:
      - RUNTIME
  - variable: GHREACTIONS_TOKEN
    secret: GHREACTIONS_TOKEN
    availability:
      - RUNTIME
  - variable: UPSTASH_REDIS_REST_TOKEN
    secret: UPSTASH_REDIS_REST_TOKEN
    availability:
      - RUNTIME

scripts:
  buildCommand: npx nx build ghreactions --configuration=development
  runCommand: node dist/apps/ghreactions/server/server.mjs
