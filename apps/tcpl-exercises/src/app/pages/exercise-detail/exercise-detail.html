@let exercise = exercise$ | async;
@let theme = theme$ | async;
@let submissionPending = submissionPending$ | async;

<!-- The resolver puts the exercise in the store before this page renders. -->
@if (exercise) {
  <ng-template #compilationErrorsTitle>
    <nz-badge [nzDot]="!!exercise.compilationError">
      <span>Compilation Errors&nbsp;&nbsp;</span>
    </nz-badge>
  </ng-template>

  <ng-template #submit>
    <button
      nz-button
      nzType="primary"
      type="button"
      [disabled]="submissionPending || selectedTabIndex() !== 0"
      (click)="onSubmit()"
    >
      Submit
    </button>
  </ng-template>

  <div class="exercise-layout">
    <div class="top-row">
      <app-panel heading="Description" [loading]="exerciseLoading()">
        <app-exercise-description [description]="exercise.description" />
      </app-panel>

      <app-panel>
        <nz-tabs
          nzDestroyInactiveTabPane
          [nzTabBarExtraContent]="submit"
          [nzSelectedIndex]="selectedTabIndex()"
          (nzSelectedIndexChange)="selectedTabIndex.set($event)"
        >
          <nz-tab nzTitle="Code">
            <div class="editor-section">
              <app-code-editor
                [code]="exercise.code"
                [theme]="theme!"
                (codeChange)="onCodeChange($event)"
                [loading]="exerciseLoading()"
              />
            </div>
          </nz-tab>

          <nz-tab [nzTitle]="compilationErrorsTitle">
            <div class="readonly-editor">
              <app-code-editor
                [code]="exercise.compilationError"
                [theme]="theme!"
                [readonly]="true"
                language="text"
                [loading]="exerciseLoading()"
              />
            </div>
          </nz-tab>

          <nz-tab nzTitle="Solution">
            <div class="readonly-editor">
              <app-code-editor
                [code]="exercise.solution"
                [theme]="theme!"
                [readonly]="true"
                [loading]="exerciseLoading()"
              />
            </div>
          </nz-tab>
        </nz-tabs>
      </app-panel>
    </div>

    <app-panel heading="Test Cases" [loading]="exerciseLoading()">
      @if (exercise.tests.length > 0) {
        <div panel-extra class="legend">
          <span class="legend-item"><span class="space">S</span> space</span>
          <span class="legend-item"><span class="tab">T</span> tab</span>
          <span class="legend-item"
            ><span class="newline">N</span> newline</span
          >
        </div>
      }

      <app-test-cases
        [tests]="exercise.tests"
        [submissionPending]="submissionPending ?? false"
        ngSkipHydration
      />
    </app-panel>

    <!-- <app-submissions [submissions]="submissions ?? []" ngSkipHydration /> -->
  </div>
}
