env:
  - variable: PROJECT_ID
    value: chineseflashcards-4aea7
    availability:
      - RUNTIME
  - variable: ENVIRONMENT_NAME
    value: prod
    availability:
      - RUNTIME
  # App Hosting's build preparer used to inject this (and
  # NG_TRUST_PROXY_HEADERS, now in apphosting.yaml). Since
  # GoogleCloudPlatform/buildpacks fb7a183f6 it only does so when the backend's
  # rootDir has an angular.json or a package.json with @angular/core, which
  # this Nx app folder doesn't, so Angular SSR rejected every request (400).
  # Value copied from the last revision that had it injected.
  - variable: NG_ALLOWED_HOSTS
    value: chinese-flashcards-321324490138.us-east4.run.app,chinese-flashcards-2rllqzh5lq-uk.a.run.app,t-416441569---chinese-flashcards-2rllqzh5lq-uk.a.run.app,chinese-flashcards--chineseflashcards-4aea7.us-east4.hosted.app
    availability:
      - RUNTIME

scripts:
  buildCommand: npx nx build chinese-flashcards --configuration=production
  runCommand: node dist/apps/chinese-flashcards/server/server.mjs
