<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GitHub Reactions</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Per-page title, description and canonical URL come from SeoService. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GitHub Reactions" />
    <!-- og:image itself needs an absolute URL, so SeoService adds it. -->
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <!-- X reads og:title, og:description and og:image too. -->
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👍</text></svg>"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "GitHub Reactions",
        "description": "Search GitHub for reactions to issues, PRs, and commits. View activity across any public GitHub account.",
        "url": "https://ghreactions.io",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "All"
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
