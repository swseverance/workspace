<nz-layout>
  <nz-header>
    <a routerLink="/"><strong>GitHub Reactions</strong> &nbsp; &#128077;</a>
    <span class="icons">
      <button nz-button nzType="text" (click)="theme.toggle()">
        <span
          nz-icon
          [nzType]="(theme.mode$ | async) === 'dark' ? 'sun' : 'moon'"
          nzTheme="outline"
        ></span>
      </button>

      <a
        nz-button
        nzType="text"
        href="https://github.com/swseverance/workspace/tree/main/apps/ghreactions"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub repository"
      >
        <span nz-icon nzType="github" nzTheme="outline"></span>
      </a>
    </span>
  </nz-header>
  <nz-content>
    <router-outlet />
  </nz-content>
</nz-layout>
