env:
  - variable: PROJECT_ID
    value: ghreactionsprod
    availability:
      - RUNTIME
  - variable: ENVIRONMENT_NAME
    value: prod
    availability:
      - RUNTIME
  - variable: GHREACTIONS_TOKEN
    secret: GHREACTIONS_TOKEN
    availability:
      - RUNTIME
  - variable: UPSTASH_REDIS_REST_TOKEN
    secret: UPSTASH_REDIS_REST_TOKEN
    availability:
      - RUNTIME
  # App Hosting stopped injecting these on 2026-11-12 (its new build
  # preparer drops them), so Angular's SSR host check rejected every request.
  # Values copied from the last revision that had them.
  - variable: NG_TRUST_PROXY_HEADERS
    value: X-Forwarded-Host
    availability:
      - RUNTIME
  - variable: NG_ALLOWED_HOSTS
    value: ghreactions-1052665106737.us-east4.run.app,ghreactions-am53sumy6a-uk.a.run.app,t-416441569---ghreactions-am53sumy6a-uk.a.run.app,ghreactions--ghreactionsprod.us-east4.hosted.app,ghreactions.io,www.ghreactions.io
    availability:
      - RUNTIME

scripts:
  buildCommand: npx nx build ghreactions --configuration=production
  runCommand: node dist/apps/ghreactions/server/server.mjs
