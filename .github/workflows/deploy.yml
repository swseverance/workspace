name: Deploy

on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Determine affected projects
        id: affected
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          AFFECTED=$(npx nx show projects --affected --base="$BASE" --head="${{ github.sha }}")
          echo "Affected projects:"
          echo "$AFFECTED"
          {
            echo "affected<<NX_AFFECTED_EOF"
            echo "$AFFECTED"
            echo "NX_AFFECTED_EOF"
          } >> "$GITHUB_OUTPUT"
          # One exact-match flag per deployable project. A substring check on
          # the list would let ghreactions-functions alone deploy ghreactions.
          for app in ghreactions ghreactions-functions tcpl-exercises weight-tracker chinese-flashcards; do
            if echo "$AFFECTED" | grep -qx "$app"; then
              echo "$app=true" >> "$GITHUB_OUTPUT"
            else
              echo "$app=false" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Build affected projects for this environment
        run: |
          # `nx affected -t build` with no --configuration uses each
          # project's defaultConfiguration, which is "production" — correct
          # for a push to main, but wrong on develop, where the real Cloud
          # Build deploy uses --configuration=development. Only apps with a
          # dev environment are deployed from develop, so build just those.
          if [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            for app in ghreactions tcpl-exercises; do
              if echo "${{ steps.affected.outputs.affected }}" | grep -qx "$app"; then
                npx nx build "$app" --configuration=development
              fi
            done
          else
            npx nx affected -t build --parallel=3 --base="${{ steps.affected.outputs.base }}" --head="${{ github.sha }}"
          fi

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1007948396460/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
          service_account: github-deployer@swseverance-ci.iam.gserviceaccount.com

      # develop -> dev releases (only apps with a dev environment)
      - name: Deploy ghreactions (dev)
        id: deploy-ghreactions-dev
        if: github.ref == 'refs/heads/develop' && steps.affected.outputs['ghreactions'] == 'true'
        run: npm run deploy:ghreactions:dev

      - name: Deploy ghreactions-functions (dev)
        if: github.ref == 'refs/heads/develop' && steps.affected.outputs['ghreactions-functions'] == 'true'
        run: npm run deploy:ghreactions-functions:dev

      - name: Deploy tcpl-exercises (dev)
        id: deploy-tcpl-exercises-dev
        if: github.ref == 'refs/heads/develop' && steps.affected.outputs['tcpl-exercises'] == 'true'
        run: npm run deploy:tcpl-exercises:dev

      # main -> prod releases for every app with changes
      - name: Deploy ghreactions (prod)
        id: deploy-ghreactions-prod
        if: github.ref == 'refs/heads/main' && steps.affected.outputs['ghreactions'] == 'true'
        run: npm run deploy:ghreactions:prod

      - name: Deploy ghreactions-functions (prod)
        if: github.ref == 'refs/heads/main' && steps.affected.outputs['ghreactions-functions'] == 'true'
        run: npm run deploy:ghreactions-functions:prod

      - name: Deploy tcpl-exercises (prod)
        id: deploy-tcpl-exercises-prod
        if: github.ref == 'refs/heads/main' && steps.affected.outputs['tcpl-exercises'] == 'true'
        run: npm run deploy:tcpl-exercises:prod

      - name: Deploy weight-tracker (prod)
        id: deploy-weight-tracker-prod
        if: github.ref == 'refs/heads/main' && steps.affected.outputs['weight-tracker'] == 'true'
        run: npm run deploy:weight-tracker:prod

      - name: Deploy chinese-flashcards (prod)
        id: deploy-chinese-flashcards-prod
        if: github.ref == 'refs/heads/main' && steps.affected.outputs['chinese-flashcards'] == 'true'
        run: npm run deploy:chinese-flashcards:prod

      # Load each site that was just deployed. After all deploys, so one
      # failing check doesn't skip the other apps' deploys; !cancelled() so
      # every check runs even if an earlier one fails.
      - name: Smoke check ghreactions (dev)
        if: ${{ !cancelled() && steps.deploy-ghreactions-dev.outcome == 'success' }}
        run: .github/scripts/smoke-check.sh https://ghreactions--ghreactionsdev.us-east4.hosted.app/

      - name: Smoke check tcpl-exercises (dev)
        if: ${{ !cancelled() && steps.deploy-tcpl-exercises-dev.outcome == 'success' }}
        run: .github/scripts/smoke-check.sh https://tcpl-exercises--tcpl-exercises-dev.us-east4.hosted.app/

      - name: Smoke check ghreactions (prod)
        if: ${{ !cancelled() && steps.deploy-ghreactions-prod.outcome == 'success' }}
        run: .github/scripts/smoke-check.sh https://ghreactions.io/

      - name: Smoke check tcpl-exercises (prod)
        if: ${{ !cancelled() && steps.deploy-tcpl-exercises-prod.outcome == 'success' }}
        run: .github/scripts/smoke-check.sh https://kandrexercises.com/

      - name: Smoke check weight-tracker (prod)
        if: ${{ !cancelled() && steps.deploy-weight-tracker-prod.outcome == 'success' }}
        run: .github/scripts/smoke-check.sh https://weight-tracker--weight-tracker-2592f.us-east4.hosted.app/

      - name: Smoke check chinese-flashcards (prod)
        if: ${{ !cancelled() && steps.deploy-chinese-flashcards-prod.outcome == 'success' }}
        run: .github/scripts/smoke-check.sh https://chinese-flashcards--chineseflashcards-4aea7.us-east4.hosted.app/
