# apps/weight-tracker/angular.json is an empty placeholder: App Hosting's build preparer
# only injects NG_ALLOWED_HOSTS and NG_TRUST_PROXY_HEADERS (which Angular SSR
# needs, or it rejects every request with 400) when the backend's rootDir has
# an angular.json, and Nx keeps the real config elsewhere. Don't delete it.
# See https://github.com/GoogleCloudPlatform/buildpacks/commit/fb7a183f6203df0635c490b5c617028bcb6339b6

# Base settings for Backend (on Cloud Run), shared across environments.
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  maxInstances: 1 # caps cost; environments may raise it
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

# Environment variables and secrets.
# env:
# Configure environment variables.
# See https://firebase.google.com/docs/app-hosting/configure#user-defined-environment
# - variable: MESSAGE
#   value: Hello world!
#   availability:
#     - BUILD
#     - RUNTIME

# Grant access to secrets in Cloud Secret Manager.
# You can create secrets with the CLI command `firebase apphosting:secrets:set <secretName>`.
# See https://firebase.google.com/docs/app-hosting/configure#secret-parameters
# - variable: MY_SECRET
#   secret: mySecretRef
