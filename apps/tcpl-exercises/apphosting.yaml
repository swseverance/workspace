runConfig:
  minInstances: 0
  maxInstances: 1 # caps cost; environments may raise it
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

env:
  - variable: VERCEL_TEAM_ID
    value: team_0M3MOKT5ntF9hBTAuhcJCd0g
    availability:
      - RUNTIME
  - variable: UPSTASH_REDIS_REST_URL
    value: https://loyal-minnow-40926.upstash.io
    availability:
      - RUNTIME
  # Trust App Hosting's proxy for the visitor's host. Its build preparer used
  # to inject this; see NG_ALLOWED_HOSTS in the environment yamls for why it
  # no longer does.
  - variable: NG_TRUST_PROXY_HEADERS
    value: X-Forwarded-Host
    availability:
      - RUNTIME
