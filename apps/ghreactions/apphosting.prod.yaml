env:
  - variable: PROJECT_ID
    value: ghreactionsprod
    availability:
      - RUNTIME
  - variable: SITE_URL
    value: https://ghreactions.io
    availability:
      - RUNTIME
  - variable: ENVIRONMENT_NAME
    value: prod
    availability:
      - RUNTIME
  - variable: GHREACTIONS_TOKEN
    secret: GHREACTIONS_TOKEN
    availability:
      - RUNTIME
  - variable: UPSTASH_REDIS_REST_TOKEN
    secret: UPSTASH_REDIS_REST_TOKEN
    availability:
      - RUNTIME
  # App Hosting's build preparer used to inject this (and
  # NG_TRUST_PROXY_HEADERS, now in apphosting.yaml). Since
  # GoogleCloudPlatform/buildpacks fb7a183f6 it only does so when the backend's
  # rootDir has an angular.json or a package.json with @angular/core, which
  # this Nx app folder doesn't, so Angular SSR rejected every request (400).
  # Value copied from the last revision that had it injected.
  - variable: NG_ALLOWED_HOSTS
    value: ghreactions-1052665106737.us-east4.run.app,ghreactions-am53sumy6a-uk.a.run.app,t-416441569---ghreactions-am53sumy6a-uk.a.run.app,ghreactions--ghreactionsprod.us-east4.hosted.app,ghreactions.io,www.ghreactions.io
    availability:
      - RUNTIME

scripts:
  buildCommand: npx nx build ghreactions --configuration=production
  runCommand: node dist/apps/ghreactions/server/server.mjs
