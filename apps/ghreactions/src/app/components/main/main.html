<nz-collapse>
  <nz-collapse-panel nzActive nzHeader="Search">
    <form nz-form [formGroup]="form" (ngSubmit)="onSearch()">
      <nz-row [nzGutter]="[8, 8]" nzAlign="bottom">
        <nz-col class="field-col" [nzXs]="12">
          <nz-form-item nzLayout="vertical">
            <nz-form-label nzFor="username">Username</nz-form-label>
            <nz-form-control>
              <input
                nz-input
                formControlName="username"
                type="text"
                id="username"
                placeholder="GitHub username"
                autocapitalize="none"
                autocorrect="off"
              />
            </nz-form-control>
          </nz-form-item>
        </nz-col>

        <nz-col class="field-col" [nzXs]="12">
          <nz-form-item nzLayout="vertical">
            <nz-form-label nzFor="type">Type</nz-form-label>
            <nz-form-control>
              <nz-select formControlName="type" nzId="type">
                @for (option of typeOptions; track option.value) {
                  <nz-option
                    [nzLabel]="option.label"
                    [nzValue]="option.value"
                  />
                }
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </nz-col>

        <nz-col class="field-col" [nzXs]="12">
          <nz-form-item nzLayout="vertical">
            <nz-form-label nzFor="state">State</nz-form-label>
            <nz-form-control>
              <nz-select formControlName="state" nzMode="multiple" nzId="state">
                @for (
                  option of typeConfig[form.value.type!].stateOptions;
                  track option.value
                ) {
                  <nz-option
                    [nzLabel]="option.label"
                    [nzValue]="option.value"
                  />
                }
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </nz-col>

        <nz-col class="field-col" [nzXs]="12">
          <nz-form-item nzLayout="vertical">
            <nz-form-label nzFor="reactions">Reactions</nz-form-label>
            <nz-form-control>
              <nz-select
                formControlName="reactions"
                nzMode="multiple"
                nzId="reactions"
              >
                @for (
                  option of typeConfig[form.value.type!].reactionsOptions;
                  track option.value
                ) {
                  <nz-option
                    [nzLabel]="option.label"
                    [nzValue]="option.value"
                  />
                }
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </nz-col>

        <nz-col>
          <nz-form-item nzLayout="vertical">
            <nz-form-control>
              <button
                nz-button
                nzType="primary"
                [disabled]="!form.valid"
                type="submit"
              >
                Search
              </button>
            </nz-form-control>
          </nz-form-item>
        </nz-col>
      </nz-row>
    </form>
  </nz-collapse-panel>
</nz-collapse>

<section>
  <app-reactions-table
    [rows]="rows()"
    [total]="total()"
    [pageIndex]="pageIndex()"
    (pageIndexChange)="loadPage($event)"
    [loading]="loading()"
    [error]="error()"
    [emptyText]="searched() ? 'No results' : 'Enter a GitHub username'"
  />
</section>
