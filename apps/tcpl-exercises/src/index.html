<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>K&amp;R Exercises</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Per-page title, description and canonical URL come from SeoService. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="K&amp;R Exercises" />
    <!-- og:image itself needs an absolute URL, so SeoService adds it. -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="K&amp;R Exercises: solve the exercises from The C Programming Language in your browser."
    />
    <!-- X reads og:title, og:description and og:image too. -->
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Real files, not a data: URI: Google only shows an icon it can fetch,
         and otherwise falls back to /favicon.ico. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
