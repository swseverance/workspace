# Two instances, not apphosting.yaml's one: grading waits on the sandbox,
# so a slow or restarting instance shouldn't hold up every submission.
# The whole runConfig is repeated, since the docs don't say whether an
# environment's runConfig merges with the base one or replaces it.
runConfig:
  minInstances: 0
  maxInstances: 2

scripts:
  buildCommand: npx nx build tcpl-exercises --configuration=production
  runCommand: node dist/apps/tcpl-exercises/server/server.mjs

env:
  - variable: PROJECT_ID
    value: tcpl-exercises-prod
    availability:
      - RUNTIME
  - variable: VERCEL_PROJECT_ID
    value: prj_hDT7wwchGhgvhjZTFnn4br5p5huv # tcpl-exercises-prod
    availability:
      - RUNTIME
  - variable: VERCEL_TOKEN
    secret: VERCEL_TOKEN
    availability:
      - RUNTIME
  - variable: UPSTASH_REDIS_REST_TOKEN
    secret: UPSTASH_REDIS_REST_TOKEN
    availability:
      - RUNTIME
  - variable: ENVIRONMENT_NAME
    value: prod
    availability:
      - RUNTIME
  # Origin for canonical links and the sitemap.
  - variable: SITE_URL
    value: https://kandrexercises.com
    availability:
      - RUNTIME
  # App Hosting stopped injecting these on 2026-11-12 (its new build
  # preparer drops them), so Angular's SSR host check rejected every request.
  # Values copied from the last revision that had them.
  - variable: NG_TRUST_PROXY_HEADERS
    value: X-Forwarded-Host
    availability:
      - RUNTIME
  - variable: NG_ALLOWED_HOSTS
    value: tcpl-exercises-153344388097.us-east4.run.app,tcpl-exercises-smphrtkfoa-uk.a.run.app,t-416441568---tcpl-exercises-smphrtkfoa-uk.a.run.app,tcpl-exercises--tcpl-exercises-prod.us-east4.hosted.app,kandrexercises.com,www.kandrexercises.com
    availability:
      - RUNTIME
