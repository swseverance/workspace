env:
  - variable: FIREBASE_PROJECT_ID
    value: ghreactionsdev
    availability:
      - RUNTIME
  - variable: ENVIRONMENT_NAME
    value: dev
    availability:
      - RUNTIME
  - variable: GHREACTIONS_TOKEN
    secret: GHREACTIONS_TOKEN
    availability:
      - RUNTIME

scripts:
  buildCommand: npx nx build ghreactions --configuration=development
  runCommand: node dist/apps/ghreactions/server/server.mjs
