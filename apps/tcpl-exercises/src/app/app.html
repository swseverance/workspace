@let user = auth.user$ | async; @let currentTheme = theme.mode$ | async;

<nz-layout>
  <nz-header>
    <a routerLink="/"><strong>The C Programming Language Exercises</strong></a>

    <span class="icons">
      @if (user) {
      <button
        nz-button
        nzType="text"
        type="button"
        aria-label="Sign out"
        nzTooltipTitle="Sign out"
        nz-tooltip
        (click)="auth.signOut()"
      >
        <span nz-icon nzType="logout" nzTheme="outline"></span>
      </button>
      } @else {
      <button
        nz-button
        nzType="text"
        type="button"
        aria-label="Sign in with Google"
        nzTooltipTitle="Sign in with Google"
        nz-tooltip
        (click)="auth.openSignInModal()"
      >
        <span nz-icon nzType="login" nzTheme="outline"></span>
      </button>
      }

      <button
        nz-button
        nzType="text"
        type="button"
        aria-label="Toggle light and dark theme"
        [nzTooltipTitle]="
          currentTheme === 'light' ? 'Switch to dark theme' : 'Switch to light theme'
        "
        nz-tooltip
        (click)="theme.toggle()"
      >
        <span
          nz-icon
          [nzType]="currentTheme === 'light' ? 'moon' : 'sun'"
          nzTheme="outline"
        ></span>
      </button>

      <a
        nz-button
        nzType="text"
        href="https://github.com/swseverance/workspace/tree/main/apps/tcpl-exercises"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub repository"
      >
        <span nz-icon nzType="github" nzTheme="outline"></span>
      </a>
    </span>
  </nz-header>

  <nz-content>
    <router-outlet />
  </nz-content>
</nz-layout>
