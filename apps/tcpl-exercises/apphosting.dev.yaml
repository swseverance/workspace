scripts:
  buildCommand: npx nx build tcpl-exercises --configuration=development
  runCommand: node dist/apps/tcpl-exercises/server/server.mjs

env:
  - variable: PROJECT_ID
    value: tcpl-exercises-dev
    availability:
      - RUNTIME
  - variable: VERCEL_PROJECT_ID
    value: prj_0meBl6c4rXbP51iv7xkZs8eow1Rw # tcpl-exercises-dev
    availability:
      - RUNTIME
  # Scoped to only the tcpl-exercises-dev project. Secrets are per-GCP-project
  # resources, so this is a separate secret from the one apphosting.prod.yaml
  # references even though they share the same name.
  - variable: VERCEL_TOKEN
    secret: VERCEL_TOKEN
    availability:
      - RUNTIME
  - variable: UPSTASH_REDIS_REST_TOKEN
    secret: UPSTASH_REDIS_REST_TOKEN
    availability:
      - RUNTIME
  - variable: ENVIRONMENT_NAME
    value: dev
    availability:
      - RUNTIME
  # Origin for canonical links and the sitemap.
  - variable: SITE_URL
    value: https://tcpl-exercises--tcpl-exercises-dev.us-east4.hosted.app
    availability:
      - RUNTIME
  # App Hosting stopped injecting these on 2026-11-12 (its new build
  # preparer drops them), so Angular's SSR host check rejected every request.
  # Values copied from the last revision that had them.
  - variable: NG_TRUST_PROXY_HEADERS
    value: X-Forwarded-Host
    availability:
      - RUNTIME
  - variable: NG_ALLOWED_HOSTS
    value: tcpl-exercises-452141031571.us-east4.run.app,tcpl-exercises-psyi7jmtna-uk.a.run.app,t-2641246353---tcpl-exercises-psyi7jmtna-uk.a.run.app,tcpl-exercises--tcpl-exercises-dev.us-east4.hosted.app
    availability:
      - RUNTIME
