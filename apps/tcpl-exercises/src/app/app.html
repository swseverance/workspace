@let user = auth.user$ | async;
@let currentTheme = theme.mode$ | async;

<nz-layout>
  <nz-header>
    @if (sidebar.present()) {
      <!-- Unset (null) renders as open, matching the server and desktop. -->
      @let sidebarOpen = sidebar.open() !== false;
      <button
        nz-button
        nzType="text"
        type="button"
        class="sidebar-toggle ant-btn-icon-only"
        [attr.aria-controls]="sidebarOpen ? 'exercise-menu' : null"
        [attr.aria-expanded]="sidebarOpen"
        [attr.aria-label]="sidebarOpen ? 'Hide exercises' : 'Show exercises'"
        [nzTooltipTitle]="sidebarOpen ? 'Hide exercises' : 'Show exercises'"
        nz-tooltip
        (click)="sidebar.toggle()"
      >
        <span
          nz-icon
          [nzType]="sidebarOpen ? 'menu-fold' : 'menu-unfold'"
          nzTheme="outline"
        ></span>
      </button>
    }

    <a routerLink="/" class="title" aria-label="K&R Exercises">
      <strong>K&R Exercises</strong>
    </a>

    <span class="icons">
      @if (user) {
        <button
          nz-button
          nzType="text"
          class="ant-btn-icon-only"
          type="button"
          aria-label="Sign out"
          nzTooltipTitle="Sign out"
          nz-tooltip
          (click)="auth.signOut()"
        >
          <span nz-icon nzType="logout" nzTheme="outline"></span>
        </button>
      } @else {
        <button
          nz-button
          nzType="text"
          class="ant-btn-icon-only"
          type="button"
          aria-label="Sign in"
          nzTooltipTitle="Sign in"
          nz-tooltip
          (click)="auth.openSignInModal()"
        >
          <span nz-icon nzType="login" nzTheme="outline"></span>
        </button>
      }

      <button
        nz-button
        nzType="text"
        class="ant-btn-icon-only"
        type="button"
        aria-label="Toggle light and dark theme"
        [nzTooltipTitle]="
          currentTheme === 'light'
            ? 'Switch to dark theme'
            : 'Switch to light theme'
        "
        nz-tooltip
        (click)="theme.toggle()"
      >
        <span
          nz-icon
          [nzType]="currentTheme === 'light' ? 'moon' : 'sun'"
          nzTheme="outline"
        ></span>
      </button>

      <a
        nz-button
        nzType="text"
        class="ant-btn-icon-only"
        href="https://github.com/swseverance/workspace/tree/develop/apps/tcpl-exercises"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub repository"
      >
        <span nz-icon nzType="github" nzTheme="outline"></span>
      </a>
    </span>
  </nz-header>

  <nz-content libScrollTopOnNavigation>
    <router-outlet />
  </nz-content>
</nz-layout>
